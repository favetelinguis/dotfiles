set-option -g prefix C-t
unbind C-b
bind C-t send-prefix

# Start panes at 1 not 0
# setw -g pane-base-index 1
# Start windows at 1 not 0
# set -g base-index 1
# set -g renumber-windows on

# Some tweaks to the status line
set -g status-right "%H:%M"
set -g window-status-current-style default
set -g window-status-format "[#W#{?window_flags,#{window_flags},}]"
set -g window-status-current-format "[#W#{?window_flags,#{window_flags},}]"
# set -g window-status-current-format "[#I:#W#{?window_flags,#{window_flags},}]"
set -g status-position top
set -g pane-border-status off
set -g set-titles off

# Centre window list in the status bar
set -g status-justify absolute-centre

# Allow longer session names (default is 10, which truncates early)
set -g status-left-length 50

# If running inside tmux ($TMUX is set), then change the status line to red
%if #{TMUX}
set -g status-bg red
%endif

setw -g mode-keys emacs

# Enable RGB colour if running in xterm(1)
set-option -sa terminal-features ",xterm*:RGB"

# Change the default $TERM to tmux-256color
set -g default-terminal "tmux-256color"
set-option -ag update-environment " EDITOR"
set-option -ag update-environment " VISUAL"
set-option -ag update-environment " GIT_EDITOR"

# No bells at all
set -g bell-action none

# Keep windows around after they exit
set -g remain-on-exit off

# Turn the mouse on, but without copy mode dragging
set -g mouse on

# Select windows by name
bind-key -T prefix 1 new-window -S -n "1" -c "#{pane_current_path}"
bind-key -T prefix 2 new-window -S -n "2" -c "#{pane_current_path}"
bind-key -T prefix 3 new-window -S -n "3" -c "#{pane_current_path}"
bind-key -T prefix 4 new-window -S -n "4" -c "#{pane_current_path}"
bind-key -T prefix 5 new-window -S -n "5" -c "#{pane_current_path}"
bind-key -T prefix 6 new-window -S -n "GH Dash" -c "#{pane_current_path}" "sh -lc 'exec \"$HOME/.local/bin/gh-dash-review\"'"
bind-key -T prefix 7 new-window -S -n "K9s" -c "#{pane_current_path}" "exec k9s"
bind-key -T prefix 8 new-window -S -n "Edit" -c "#{pane_current_path}" "sh -lc 'export KAK_CLIENT_NAME=edit; exec \"$HOME/.local/bin/kak-tmux-session\"'"
bind-key -T prefix 9 new-window -S -n "Git" -c "#{pane_current_path}" "sh -lc 'cd \"\$(git rev-parse --show-toplevel 2>/dev/null || pwd)\" && exec lazygit'"

# A key to toggle between smallest and largest sizes if a window is visible in
# multiple places
bind F set -w window-size

# Keys to toggle monitoring activity in a window and the synchronize-panes option
bind m set monitor-activity
bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Open splits and windows in the current pane's working directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Prompt for a session name, then create it.
# -A is optional: it switches to the session if the name already exists.
unbind-key i
bind-key i command-prompt -p "new session name:" { new-session -A -s "%%%" -n 1}

# Reuse [ and ] for session cycling
unbind-key [
unbind-key ]
bind-key [ switch-client -p
bind-key ] switch-client -n
